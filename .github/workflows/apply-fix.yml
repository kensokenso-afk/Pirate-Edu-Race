name: apply-fix-bug-1-4

on:
  push:
    branches: [fix/bug-1-4]
    paths:
      - '.github/apply/apply_fix.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Terapkan patch ke index.html
        run: python3 .github/apply/apply_fix.py
      - name: Commit hasil ke branch ini
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Perbaikan bug #1 (pemulihan setelah background) dan #4 (pesan MQTT bertanda tangan)"
          git push
